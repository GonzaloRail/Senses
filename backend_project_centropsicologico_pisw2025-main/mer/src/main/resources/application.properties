spring.application.name=Sistema de registro de historias clinicas
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:senses_db}
spring.datasource.username=${DB_USERNAME:senses_admin}
spring.datasource.password=${DB_PASSWORD:senses_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.autocommit=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Used for initial migration
# spring.jpa.hibernate.ddl-auto=create-drop
# spring.liquibase.enabled=true


# --- Usuario en memoria para Spring Security ---
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# --- Configuración de JWT ---
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=900000
application.security.jwt.refresh-token.expiration=604800000
application.security.jwt.cookie.secure=${COOKIE_SECURE:false}
application.security.jwt.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# --- Logging ---
logging.level.com.tuapp.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.liquibase=INFO